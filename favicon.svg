<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- M2-Immoservice · seine dreifarbige Logoplatte, auf 32 px
       eingedampft: rotes Band, weißes Band, blaues Band, dazwischen
       ein stark vereinfachtes m mit Hochzahl. Die Wortmarke
       „immoservice" passt hier nicht hinein und fehlt deshalb.
       Sobald die Vektordatei des Logos vorliegt, wird dieses Icon
       daraus neu erzeugt. -->
  <rect width="32" height="32" fill="#FFFFFF"/>
  <rect y="2"  width="32" height="6" fill="#CA0530"/>
  <rect y="24" width="32" height="6" fill="#03428F"/>
  <g fill="#14488C">
    <rect x="5"  y="12" width="3" height="10"/>
    <rect x="11" y="12" width="3" height="10"/>
    <rect x="17" y="12" width="3" height="10"/>
    <rect x="5"  y="12" width="15" height="3"/>
    <rect x="22" y="11" width="4" height="4"/>
  </g>
</svg>
